<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Cyan Glow Rim -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f7c297"/>
    </linearGradient>

    <!-- Tactical Vest Gradient -->
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Undershirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gold Buckle / Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Tactical Target / Shield Hologram in Background -->
  <circle cx="256" cy="230" r="190" fill="url(#cyanGlow)"/>
  <circle cx="256" cy="230" r="160" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 8" stroke-opacity="0.3"/>
  <circle cx="256" cy="230" r="120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Tactical Reticle Hashmarks -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="380" x2="256" y2="410" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="76" y1="230" x2="106" y2="230" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="406" y1="230" x2="436" y2="230" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- IN-GAME CHARACTER: 3D BATTLE ROYALE SOLDIER (JONESY STYLE) -->
  <g filter="url(#dropShadow)">
    <!-- Back-Bling / Tactical Backpack Edges visible behind shoulders -->
    <rect x="140" y="270" width="232" height="180" rx="20" fill="#090d16"/>
    <rect x="156" y="280" width="200" height="160" rx="16" fill="#1e293b"/>

    <!-- Radio Comms Unit on Left Shoulder with Antenna -->
    <rect x="130" y="270" width="34" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <line x1="142" y1="270" x2="136" y2="210" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <circle cx="136" cy="208" r="5" fill="#f43f5e" filter="url(#neonGlow)"/>

    <!-- Shoulders & Arms (Tactical Sleeves) -->
    <path d="M96 370 L130 285 Q150 270 190 275 L256 285 L322 275 Q362 270 382 285 L416 370 Q370 420 320 440 L192 440 Q142 420 96 370 Z" fill="url(#shirtGrad)"/>

    <!-- Tactical Armor Vest (Chestplate) -->
    <path d="M168 280 L256 295 L344 280 L360 410 L256 425 L152 410 Z" fill="url(#vestGrad)"/>
    <path d="M174 286 L256 299 L338 286 L350 350 L256 360 L162 350 Z" fill="#243044"/>

    <!-- Neck & Throat -->
    <rect x="228" y="238" width="56" height="52" rx="8" fill="#e2a87c"/>

    <!-- Tactical Pouches on Vest -->
    <rect x="180" y="360" width="40" height="50" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="236" y="360" width="40" height="50" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="292" y="360" width="40" height="50" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- Pouch Flaps -->
    <rect x="180" y="356" width="40" height="14" rx="4" fill="#1e293b"/>
    <rect x="236" y="356" width="40" height="14" rx="4" fill="#1e293b"/>
    <rect x="292" y="356" width="40" height="14" rx="4" fill="#1e293b"/>

    <!-- Head & Face (Blocky 3D-model proportions) -->
    <g id="head">
      <!-- Ears -->
      <rect x="172" y="160" width="22" height="36" rx="8" fill="#e2a87c"/>
      <rect x="318" y="160" width="22" height="36" rx="8" fill="#e2a87c"/>

      <!-- Main Head Box -->
      <rect x="186" y="120" width="140" height="144" rx="28" fill="url(#skinGrad)"/>

      <!-- Angular Jaw / Chin highlight -->
      <path d="M210 240 L256 256 L302 240 L290 264 L256 268 L222 264 Z" fill="#e2a87c"/>

      <!-- Mouth (Determined hero smirk) -->
      <path d="M236 226 Q256 230 274 225" stroke="#9a3412" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- Nose (Angular 3D style) -->
      <polygon points="256,182 264,204 248,204" fill="#e2a87c"/>

      <!-- Eyes & Eyebrows -->
      <!-- Left Brow -->
      <path d="M208 162 L242 167" stroke="#854d0e" stroke-width="7" stroke-linecap="round"/>
      <!-- Left Eye -->
      <rect x="214" y="172" width="26" height="18" rx="4" fill="#ffffff"/>
      <rect x="224" y="174" width="14" height="14" rx="3" fill="#0f172a"/>
      <circle cx="232" cy="177" r="3" fill="#ffffff"/>

      <!-- Right Brow -->
      <path d="M304 162 L270 167" stroke="#854d0e" stroke-width="7" stroke-linecap="round"/>
      <!-- Right Eye -->
      <rect x="272" y="172" width="26" height="18" rx="4" fill="#ffffff"/>
      <rect x="274" y="174" width="14" height="14" rx="3" fill="#0f172a"/>
      <circle cx="278" cy="177" r="3" fill="#ffffff"/>

      <!-- Blonde Hair (Swooped 3D mesh volume) -->
      <path d="M178 134 Q186 92 256 90 Q326 92 334 134 L334 156 Q310 120 256 122 Q202 120 178 156 Z" fill="url(#hairGrad)"/>
      <path d="M182 130 Q220 98 274 100 Q320 102 330 138 Q290 114 246 116 Q206 118 182 130 Z" fill="#fef08a" opacity="0.6"/>
      <!-- Forehead hair bangs / stylized tuft -->
      <path d="M214 116 Q240 138 270 126 Q250 144 230 142 Z" fill="#ca8a04"/>
    </g>

    <!-- Tactical Dog Tag Necklace -->
    <path d="M242 278 Q256 312 270 278" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <rect x="250" y="300" width="12" height="20" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

    <!-- Gold Accent Belt Buckle at bottom -->
    <rect x="238" y="440" width="36" height="26" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="248" y="446" width="16" height="14" rx="3" fill="#0f172a"/>
  </g>

  <!-- Cyan Electric Particle Highlights -->
  <circle cx="90" cy="150" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="420" cy="140" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="430" cy="330" r="3.5" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="80" cy="340" r="3" fill="#06b6d4" filter="url(#neonGlow)"/>

  <!-- Badge banner: SPHERE STRIKE -->
  <g transform="translate(0, 436)">
    <rect x="76" y="10" width="360" height="46" rx="23" fill="#020617" fill-opacity="0.9" stroke="#06b6d4" stroke-width="2.5"/>
    <text x="256" y="40" font-family="'Black Ops One', 'Impact', sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      SPHERE STRIKE
    </text>
  </g>
</svg>
